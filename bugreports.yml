---
- summary: |
   На странице товара есть хэштег с переходом в категорию
environment: |
    Версия: 149.0.7827.156 (официальная сборка) (64 бит) 
    ОС Windows
steps-to-reproduce: |
    1. Зайти на страницу сайта https://products-store.hexlet.app/
    2. Выбрать товар и зайти в его описание
expected-result: |
    При нажатии на хештег должен быть переход в категорию
actual-result: |
  При нажатии нечего не просиходит

- summary: |
   Сайт должен иметь локализацию (перевод) на русский и английский языки. 
environment: |
    Версия: 149.0.7827.156 (официальная сборка) (64 бит) 
    ОС Windows
steps-to-reproduce: |
    1. Зайти на страницу сайта https://products-store.hexlet.app/
    2. Выбрать Язык
expected-result: |
   У сайт должен быть полный перевод на Английский или Русский язык
actual-result: |
   Частичный и не корректный переевод страницы 

- summary: |
   Пользователь должен иметь возможность поиска по строке поиска. 
environment: |
    Версия: 149.0.7827.156 (официальная сборка) (64 бит) 
    ОС Windows
steps-to-reproduce: |
    1. Зайти на страницу сайта https://products-store.hexlet.app/
    2. Перейти в поисковое поле, где написать "Искать"
expected-result: |
   Ввести название товара и товар должен появится на странице
actual-result: |
   При вводе слова в поиске, товар не ищется

