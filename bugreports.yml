- summary: |
    Хэштег на странице товара не кликается (нет перехода по ссылке)
  environment: |
    Версия: 149.0.7827.156 (официальная сборка) (64 бит) 
    ОС Windows
  steps-to-reproduce: |
    1. Зайти на страницу сайта https://products-store.hexlet.app/
    2. Выбрать любую карточку товара и кликнуть на нёё
  expected-result: |
    На странице товара есть хештег при клике на который мы переёдем в категорию
  actual-result: |
    Есть хештег, но он не кликабельный. При нажатии ничего не просиходит

- summary: |
    Неровное отображение колличества товаров, при добавлении в карзину разных товаров
  environment: |
    Версия: 149.0.7827.156 (официальная сборка) (64 бит) 
    ОС Windows
  steps-to-reproduce: |
    1. Зайти на страницу сайта https://products-store.hexlet.app/
    2. Выбрать от двух товаров и более и добавить в карзину 
  expected-result: |
    При добавлении товара должно все отображаться ровно и корректно
  actual-result: |
    При добавлении разных товаров, происходит сдвиг в колонке колличества товаров


   

    


    
