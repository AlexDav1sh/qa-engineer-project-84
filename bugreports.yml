- summary: |
   Функции поиска и фильтрации не работают:  Пользователь должен иметь возможность поиска по строке поиска, Проверка работы фильтров вместе, Пользователь должен иметь возможность фильтровать по наличию, Пользователь должен иметь возможность фильтровать по производителю,  Пользователь должен иметь возможность фильтровать товары,
   Пользователь должен иметь возможность искать товары по ключевому слову, Пользователь должен иметь возможность искать товары по категории.
  environment: |
    Версия: 149.0.7827.156 (официальная сборка) (64 бит) 
    ОС Windows
  steps-to-reproduce: |
    1. Зайти на страницу сайта https://products-store.hexlet.app/
    2. Выбрать функцию поиска или фильтрации по сайту
  expected-result: |
    При поиске и фильтрации товара должен искаться нужный товар
  actual-result: |
    При использовании всех функций поиск товара не корректный
    
