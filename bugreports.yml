---
- summary: |
   На главной страницу каталога у товаров не отображается рейтинг
  environment: |
    Версия: 149.0.7827.156 (официальная сборка) (64 бит) 
    ОС Windows
  steps-to-reproduce: |
    1. Зайти на страницу сайта https://products-store.hexlet.app/
    2. Перейти на главную страницу сайта
  expected-result: |
    При нахождении на главной странице и при наличии на ней товара, пользователь видет рейтинг товара
  actual-result: |
    При переходе не главную страницу, у пользователья не отображается рейтинг товара на карточке товара 

- summary: |
   Фильтры и поиск работают только по текущей странице каталога.
  environment: |
    Версия: 149.0.7827.156 (официальная сборка) (64 бит) 
    ОС Windows
  steps-to-reproduce: |
    1. Зайти на страницу сайта https://products-store.hexlet.app/
    2. Выбрать функцию поиска или фильтрации по сайту
  expected-result: |
    При поиске и фильтрации товара должен искаться нужный товар
  actual-result: |
    При использовании функций фильтраций и поиска не ищется нужный товар, так же выходят ошибки об отсуствии товара 
    
- summary: |
    На мобильном устройстве наблюдается нарушение вёрстки сайта
  environment: |
    Мобильный телефона iPhone 12
    Браузер Safari
  steps-to-reproduce: |
    Запущен мобильный телефон им браузер
    Загрузка страницы сайта https://products-store.hexlet.app/
  expected-result: |
    Должен корректно отображаться сайт  на мобильном телефоне 
  actual-result: |
    Съезжает отображение товаров на главной странице ( сначала показыватся фильтры, а ниже только показывается товар ), так же на странице карзины названия и цена товара не помещаются в спецаильные поля разметки отображения
    
