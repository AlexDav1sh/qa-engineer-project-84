- summary: |
    Добавление одинаковых товаров в корзину
  requirement: |
    При добавлении одинаковых товаров в карзину, будет отоброжаться их колличество 
  prerequisites: |
    Должен быть открыт сайт https://products-store.hexlet.app/
    Открыт devtools 
  test-data: |
    - Каталог товаров
    - devtools - Network
  steps:
    - Нажать "Добавить в корзину" у нескольких товаров
    - Зайти в "Карзину"
    - Проверка devtools
  expected-result: |
    Пользователь должен колличество одинаковых товаров которые он добавил в карзину, при добавлени status 200 - devtools, запрос уходит корректно
  
- summary: |
    Добавление разных товаров в корзину
  requirement: |
    При добавлении разных товаров в карзину, будут отоброжаться все отдельно
  prerequisites: |
    Должен быть открыт сайт https://products-store.hexlet.app/
  test-data: |
    - Каталог товаров
  steps:
    - Нажать "Добавить в корзину" у нескольких товаров
    - Зайти в "Карзину"
  expected-result: |
    Пользователь должен видеть все товары которые он добавил в карзину
    
