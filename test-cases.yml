  steps:
    - Перейти в раздел выбора языков
    - Выбрать Русский
    - Открыть главную страницу сайта
    - Открыть корзину
    - Открыть описание товара
  expected-result: |
    Пользователь может поменять локализацию на Русский на всех разделах сайта.

