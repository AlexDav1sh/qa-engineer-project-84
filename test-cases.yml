- summary: |
   На странице товара есть хэштег с переходом в категорию.
  requirement: |
   При нахождении в "Корзине" есть кликабельная с переходом в категорию кнопка с хештегом товара 
  prerequisites: |
   Должен быть открыт сайт https://products-store.hexlet.app/
  test-data: |
    - Корзина 
  steps:
    - На странице "корзина" нажать на хештек-категорию 
  expected-result: |
    Пользователь может из корзины перейти по хештегу в любую категорию товара в зависимомсти какой хештег у товара 
  
- summary: |
   Навигация по страницам каталога
  requirement: |
   При нажатии на кнопки "Предыдущая" и "Следующая" пользователь переходит между страницами каталога.
  prerequisites: |
    Должен быть открыт сайт https://products-store.hexlet.app/
  test-data: |
    - Каталог товаров
    - Кнопки навигации: "Предыдущая", "Следующая"
  steps:
    - На главной странице сайта перейти в каталог товаров.
    - Нажать кнопку "Следующая" и дождаться загрузки следующей страницы каталога.
    - При нажатии "Предыдущая" и вернуться на предыдущую страницу каталога.
  expected-result: |
    Пользователь может переключатся по страницам каталога с помощью кнопок "Следующая" и "Предыдущая"

- summary: |
    Продолжение покупок из корзины.
  requirement: |
    При перехеоде по кнопке, покупатель возвращается на старинцу с товаром
  prerequisites: |
    Должен быть открыт сайт https://products-store.hexlet.app/
  test-data: |
    - Корзина 
  steps:
    - На главной странице сайта зайти в Тележку - "корзину"
    - На странице "корзина" нажать кнопку "Продолжить покупки"
  expected-result: |
    Пользователь может из корзины перейти на страницу с товаром и продолжить покупки
    
- summary: |
    Очистка корзины
  requirement: |
    При очистки корзины удаплятся все товары из неё 
  prerequisites: |
    Должен быть открыт сайт https://products-store.hexlet.app/
  test-data: |
    - Корзина 
  steps:
    - На главной странице сайта зайти в Тележку - "корзину"
    - Нажать кнопку "Очистить корзину"
  expected-result: |
    Пользователь молжет удалисть весь товар из корзины сразу
    
- summary: |
    Удаление товара из корзины.
  requirement: |
    Товары должны удалятся из карзины 
  prerequisites: |
    Должен быть открыт сайт https://products-store.hexlet.app/
  test-data: |
    - Корзина 
  steps:
    - На главной странице сайта зайти в Тележку - "корзину"
    - На протв выбранного товара нажать "Удалить"
  expected-result: |
    Пользователь может удалять товары из карзины

- summary: |
    Добавление нескольких товаров в корзину
  requirement: |
    При выборе нескольких товаров они должны поместиться в корзину 
  prerequisites: |
    Должен быть открыт сайт https://products-store.hexlet.app/
  test-data: |
    - Каталог товаров
  steps:
    - Нажать "Добавить в корзину" у нескольких товаров
  expected-result: |
    Пользователь должен зайти в корзину и увидеть все товары добавленные в карзину, больше 1 

- summary: |
    Проверка работы фильтров вместе.
  requirement: |
    При выборе фильтра всех фильтров должно искать товар 
  prerequisites: |
    Должен быть открыт сайт https://products-store.hexlet.app/
  test-data: |
    - Категория
    - Бренд
    - В наличии
    - Цена
  steps:
    - Проставить чекбоксы или выбрать нужное у всех фильтров
  expected-result: |
    Пользователь должен получить получить список товара по его цене, наличию, бренду и категории одновременно.
    
- summary: |
    Фильтр по наличию.
  requirement: |
    При выборе чекбокса пользователь должен отсортировать товар
  prerequisites: |
    Должен быть открыт сайт https://products-store.hexlet.app/
  test-data: |
    Чекбокс под надписью "В наличии"
  steps:
    - Поставить отметку в чекбоксе "В наличии"
  expected-result: |
    Пользователь должен получить получить товар который есть в наличии
  
- summary: |
    Фильтр по производителю.
  requirement: |
    При выборе нужного производителя должна быть сортировка по его названию в каталоге товаров
  prerequisites: |
    Должен быть открыт сайт https://products-store.hexlet.app/
  test-data: |
    Слева на сайте расположены чекбоксы
  steps:
    - Поставить отметку в чекбоксе 
  expected-result: |
    Пользователь должен получить товар под нужнем брендом, проставив чекбокс
 
- summary: |
    Отображение товаров в общем каталоге на главной странице
  prerequisites: |
    Должен быть открыт сайт https://products-store.hexlet.app/
    В общем каталоге страницы должен быть хоть один товар
  test-data: |
    - Краточка товара
  steps:
    - Найти любую карточку в общем каталоге сайте
    - Проверить наилчие название товара
    - Проверить налчие рейтинга товара
    - Проверить налчие цены без скидки
    - Проверить наличие цены со скидкой
  expected-result: |
    Пользователь должен видеть на главной странице отоброжение названия товара, рейтинга товара, цена со скидкой или без скидки 

- summary: |
    Отображение товаров на странице товара
  prerequisites: |
    Должен быть открыт сайт https://products-store.hexlet.app/
    В каталоге должен быть хоть один товар, по которому можно кликнуть и перейти на его страницу
  test-data: |
    - Краточка товара
  steps:
    - Кликнуть на любой товар, что бы перейти на его страницу
    - Проверить наличие название товара
    - Проверить налчие рейтинга товара
    - Проверить налчие цены без скидки
    - Проверить наличие цены со скидкой
  expected-result: |
    Пользователь должен видеть странице товара отоброжение названия товара, рейтинга товара, цена со скидкой или без скидки 
    
