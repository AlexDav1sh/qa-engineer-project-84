---
- summary: |
    Пользователь должен иметь возможность оплатить товар и закрыть форму оплаты
  requirement: |
    После оплаты товара, пользователь должен закрыть форму
  prerequisites: |
    Должен быть открыт сайт https://products-store.hexlet.app/
  test-data: |
    - Форма оплаты 
  steps:
    - Добавить в "Корзину товар"
    - Нажать кнопку оформить заказ
    - Закрыть форму на "Крестик" в правом верхнем углу
  expected-result: |
    Пользователь может оформить заказ и закрыть форму оплаты 
  
- summary: |
    Пользователь должен иметь возможность поиска по строке поиска
  requirement: |
    При добавлении слова в поиск, должен появится товар который ищут
  prerequisites: |
    Должен быть открыт сайт https://products-store.hexlet.app/
  test-data: |
    - Каталог товаров
  steps:
    - Поставить курсор в поле "Поиск"
    - Вбить слово для поиска товара
  expected-result: |
    Пользователь должен видеть все товары которые он добавил в карзину
    
- summary: |
    Проверка на мобильном устройстве 
  requirement: |
    При открытии на мобильном устройстве сайт должен работать корректно 
  prerequisites: | 
    Должен быть открыт сайт https://products-store.hexlet.app/
    Включенный мобильный телефон ( Iphone 12 )
  test-data: |
    - мобильное устрйоство Iphone 12
  steps:
    - Открыть браузер в мобильном устройстве
    - Выставить фильтры 
    - Просмотреть каталог
    - Открыть товар
    - Добавить товар в корзину 
    - Переход в корзину
    - Оформление заказа
  expected-result: |
    Пользователь должен открыть сайт на мобильном устройстве, получить полный функцонал сайт и корректную работу всех разделов

- summary: |
    Проверка в браузере FireFox
  requirement: |
    При открытии сайт в браузере FireFox работает корректно 
